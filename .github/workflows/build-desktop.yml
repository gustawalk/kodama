name: Build desktop application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - run: bun ci
      - run: bun run tauri build --bundles nsis --ci
      - name: Check Windows application identity
        shell: pwsh
        run: |
          $app = 'src-tauri/target/release/Kodama.exe'
          if (!(Test-Path $app)) { throw 'Expected Kodama.exe was not built' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $app).Path)
          if ($null -eq $icon) { throw 'Kodama.exe has no embedded icon' }
          $installers = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter 'Kodama*.exe'
          if ($installers.Count -eq 0) { throw 'Expected a Kodama NSIS installer' }
      - uses: actions/upload-artifact@v4
        with:
          name: kodama-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils
      - run: bun ci
      - run: bun run tauri build --bundles appimage --ci
      - uses: actions/upload-artifact@v4
        with:
          name: kodama-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
