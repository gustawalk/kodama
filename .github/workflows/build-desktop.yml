name: Build and release desktop application

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodama-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - run: bun ci
      - name: Check version and release notes
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          test "$package_version" = "$tauri_version"
          test "$package_version" = "$cargo_version"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "v${package_version}"
            test -s "docs/releases/${GITHUB_REF_NAME}.md"
          fi
      - run: bun test
      - run: bun run format:check
      - run: bun run build

  windows:
    needs: verify
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Require signing secrets
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Configure the Kodama updater signing secrets before building a release.'
          }
      - run: bun ci
      - run: bun run tauri build --bundles nsis --ci
      - name: Check installer and signature
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe')) { throw 'Missing NSIS installer' }
          if (-not (Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe.sig')) { throw 'Missing NSIS signature' }
      - uses: actions/upload-artifact@v4
        with:
          name: kodama-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: verify
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Require signing secrets
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - run: bun ci
      - run: bun run tauri build --bundles dmg,app --ci
      - name: Check updater archive and signature
        run: |
          ls src-tauri/target/release/bundle/dmg/*.dmg
          ls src-tauri/target/release/bundle/macos/*.app.tar.gz
          ls src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
      - uses: actions/upload-artifact@v4
        with:
          name: kodama-macos
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  appimage:
    needs: verify
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.KODAMA_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config xdg-utils
      - name: Require signing secrets
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - run: bun ci
      - run: bun run tauri build --bundles appimage --ci
      - name: Check AppImage and signature
        run: |
          ls src-tauri/target/release/bundle/appimage/*.AppImage
          ls src-tauri/target/release/bundle/appimage/*.AppImage.sig
      - uses: actions/upload-artifact@v4
        with:
          name: kodama-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, windows, macos, appimage]
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: kodama-*
          path: release-assets
          merge-multiple: true
      - name: Generate updater manifest
        env:
          RELEASE_ASSETS_DIR: release-assets
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: docs/releases/${{ github.ref_name }}.md
          UPDATER_MANIFEST_PATH: release-assets/updater.json
        run: node scripts/generate-updater-manifest.mjs
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f ! -name '*.sig' -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "Kodama ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --latest
          fi
      - name: Remove temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id' | while read -r artifact_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
